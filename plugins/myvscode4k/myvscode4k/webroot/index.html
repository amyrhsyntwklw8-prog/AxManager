<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My VSCode 4K</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0e14;color:#e6edf3;font-family:Tahoma,Consolas,monospace}
header{background:#010409;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d}
header b{color:#58a6ff}
.toolbar{background:#0d1117;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #30363d}
select{background:#010409;color:#fff;border:1px solid #30363d;border-radius:8px;padding:8px}
.switch{display:flex;align-items:center;gap:8px;background:#010409;border:1px solid #30363d;border-radius:20px;padding:6px 12px}
.switch input{width:20px;height:20px}
button{background:#238636;color:#fff;border:0;border-radius:10px;padding:10px 14px}
button.blue{background:#1f6feb}button.gray{background:#30363d}button.red{background:#a40e26}
.main{display:grid;grid-template-columns:250px 1fr;min-height:50vh}
.side{background:#0d1117;padding:10px;border-left:1px solid #30363d}
.side input{width:100%;background:#010409;border:1px solid #30363d;color:#fff;border-radius:8px;padding:8px;margin:6px 0;direction:ltr}
.editor{display:flex;flex-direction:column;background:#0b0e14}
.tabs{background:#010409;padding:8px;color:#9fb3c8;border-bottom:1px solid #30363d;font-size:13px}
textarea{flex:1;min-height:340px;background:#0b0e14;color:#e6edf3;border:0;padding:14px;font-size:15px;line-height:1.9;outline:none;direction:ltr;text-align:left;font-family:Consolas,monospace}
.term{background:#000;padding:12px;border-top:2px solid #238636}
#out{white-space:pre-wrap;direction:ltr;text-align:left;max-height:320px;overflow:auto;font-size:13px;background:#000;color:#d6ffdf}
#cmd{width:100%;background:#0d1117;color:#58ff9b;border:1px solid #30363d;border-radius:8px;padding:10px;margin-top:8px;direction:ltr}
footer{background:#1f6feb;padding:6px 12px;font-size:12px;display:flex;justify-content:space-between}
@media(min-width:2000px){body{font-size:19px}textarea{font-size:20px;min-height:560px}#out{font-size:17px;max-height:520px}}
</style>
</head>
<body>
<header><b>★ My VSCode 4K</b><span id="priv">در حال بررسی دسترسی...</span></header>

<div class="toolbar">
<select id="lang"><option value="sh">Shell (.sh)</option><option value="py">Python (.py)</option></select>
<label class="switch"><input type="checkbox" id="sysMode" checked onchange="upd()"><span id="modeTxt">روی سیستم: روشن</span></label>
<button onclick="runEditor()">▶ اجرای کد ویرایشگر</button>
<button class="blue" onclick="checkEnv()">بررسی روت و پایتون</button>
<button class="gray" onclick="listDir()">فایل‌ها</button>
<button class="red" onclick="clearTerm()">پاک کردن ترمینال</button>
</div>

<div class="main">
<div class="side">
<b>EXPLORER</b>
<input id="path" value="/data/local/tmp" placeholder="/path">
<button class="blue" onclick="listDir()">نمایش</button>
<button class="gray" onclick="openFile()">باز کردن در ویرایشگر</button>
<button class="gray" onclick="saveAs()">ذخیره ویرایشگر در این مسیر</button>
<div style="font-size:12px;color:#9fb3c8;margin-top:8px">حالت داخل برنامه فقط داخل workspace خود پلاگین کار می‌کند.</div>
</div>
<div class="editor">
<div class="tabs" id="tabName">● main.sh — ویرایشگر</div>
<textarea id="code" spellcheck="false">echo "سلام از AxManager"
id
whoami
getprop ro.product.model
</textarea>
</div>
</div>

<div class="term">
<b style="color:#58ff9b">TERMINAL</b>
<pre id="out">آماده...
1- زبان را انتخاب کن (Shell / Python)
2- کلید روی سیستم را روشن/خاموش کن
3- Run را بزن</pre>
<input id="cmd" placeholder="دستور بنویس و Enter بزن, مثل: ls -la" onkeydown="if(event.key==='Enter')termRun()">
</div>
<footer><span id="st">● آماده</span><span>4K • AxManager WebUI</span></footer>

<script>
function upd(){
 let s=document.getElementById('sysMode').checked;
 document.getElementById('modeTxt').textContent = s ? 'روی سیستم: روشن' : 'داخل برنامه: روشن';
 document.getElementById('lang').onchange = ()=>{
  document.getElementById('tabName').textContent = document.getElementById('lang').value==='py' ? '● main.py — ویرایشگر' : '● main.sh — ویرایشگر';
 };
}
upd();
function ex(c){
 try{
  if(typeof ksu!=='undefined') return ksu.exec(c);
  return '[پیش‌نمایش مرورگر] '+c;
 }catch(e){return 'خطا: '+e}
}
function info(){
 try{ return JSON.parse(ksu.moduleInfo()); }catch(e){ return {moduleDir:'/data/local/tmp'} }
}
function print(t){ document.getElementById('out').textContent=t; }
function clearTerm(){ print(''); }
function isDangerous(s){
 let b=['rm -rf /','rm -rf /*','dd if=','mkfs','reboot','shutdown','wipe','format','settings put global','settings put secure'];
 s=s.toLowerCase();
 for(let x of b) if(s.includes(x)) return x;
 return null;
}
function checkEnv(){
 let c="echo ===ID===; id; echo ===WHO===; whoami; echo ===SU===; su -c id || echo no-su; echo ===PYTHON===; which python3; python3 --version 2>&1 || echo no-python3; which python 2>&1; echo ===SELINUX===; getenforce 2>&1; echo ===DIR===; echo $AXERONDIR; ls $AXERONDIR/plugins 2>&1 | head -n 20";
 print(ex(c));
 try{ document.getElementById('priv').textContent = ex('id').split('\n')[0].slice(0,80);}catch(e){}
}
function listDir(){
 let p=document.getElementById('path').value;
 print('$ ls -la '+p+'\n\n'+ex("ls -la '"+p+"' 2>&1"));
}
function openFile(){
 let p=document.getElementById('path').value;
 document.getElementById('code').value = ex("cat '"+p+"' 2>&1");
 print('خوانده شد: '+p);
}
function saveAs(){
 let p=document.getElementById('path').value;
 let txt=document.getElementById('code').value;
 let b=btoa(unescape(encodeURIComponent(txt)));
 print(ex("echo '"+b+"' | base64 -d > '"+p+"' && echo saved: "+p+" 2>&1"));
}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function runEditor(){
 let lang=document.getElementById('lang').value;
 let sys=document.getElementById('sysMode').checked;
 let code=document.getElementById('code').value;
 if(!sys){
  let d=isDangerous(code);
  if(d){ print('⛔ در حالت داخل برنامه این دستور بسته است: '+d+'\nبرای اجرایش کلید روی سیستم را روشن کن.'); return; }
 }
 let mod=info(); let dir=mod.moduleDir||'/data/local/tmp';
 let ws=dir+'/workspace';
 ex("mkdir -p '"+ws+"' 2>&1");
 let fname = lang==='py' ? 'main.py' : 'main.sh';
 let fpath = ws+'/'+fname;
 ex("echo '"+b64(code)+"' | base64 -d > '"+fpath+"' && chmod 755 '"+fpath+"' 2>&1");
 let cmd='';
 if(lang==='py'){
  // پایتون روی گوشی به صورت پیش‌فرض نیست، باید باینری داشته باشی
  let hasPy = ex("which python3 2>&1");
  if(hasPy.includes('no')||hasPy.includes('not found')||hasPy.trim()===''){
   print('❌ python3 پیدا نشد.\n'+hasPy+'\n\nراه حل:\n1- یک باینری python3 استاتیک داخل پلاگین بذار در system/bin\n2- یا فعلا زبان Shell را انتخاب کن\n3- دکمه بررسی روت و پایتون را بزن تا مسیر را ببینی');
   return;
  }
  cmd = sys ? "python3 '"+fpath+"' 2>&1" : "cd '"+ws+"' && timeout 20s python3 './"+fname+"' 2>&1";
 }else{
  cmd = sys ? "sh '"+fpath+"' 2>&1" : "cd '"+ws+"' && timeout 20s sh './"+fname+"' 2>&1";
 }
 let tag = sys ? '[SYSTEM] ' : '[APP] ';
 print('$ '+tag+cmd+'\n\n'+ex(cmd));
 document.getElementById('st').textContent='● آخرین اجرا: '+(sys?'سیستم':'برنامه')+' • '+new Date().toLocaleTimeString();
}
function termRun(){
 let c=document.getElementById('cmd').value;
 document.getElementById('cmd').value='';
 let sys=document.getElementById('sysMode').checked;
 if(!sys){
  let d=isDangerous(c);
  if(d){ print('⛔ بسته شد: '+d); return; }
  let ws=info().moduleDir+'/workspace';
  ex("mkdir -p '"+ws+"'");
  c="cd '"+ws+"' && timeout 20s "+c+" 2>&1";
 }else{ c=c+" 2>&1"; }
 print('$ '+(sys?'[SYSTEM] ':'[APP] ')+c+'\n\n'+ex(c));
}
setTimeout(checkEnv,500);
</script>
</body>
</html>
