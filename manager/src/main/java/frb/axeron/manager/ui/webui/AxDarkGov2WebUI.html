<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AxDubai Dark Gov V2</title>
<style>:root{--gold:#F5D97A;--bg:#07070A;--card:#12141C;--rgb:#00E5FF}body.light{--bg:#f2f2f2;--card:#fff;--gold:#222}body{background:var(--bg);color:var(--gold);font-family:sans-serif;margin:0}header{padding:14px;background:linear-gradient(90deg,#000,#0B1628,#3a2d00);font-weight:800;display:flex;justify-content:space-between;flex-wrap:wrap}button{background:var(--gold);border:0;border-radius:8px;padding:8px 12px;font-weight:700;margin:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:var(--card);border:1px solid #6b5a1f;border-radius:12px;padding:10px}.rgb{animation:g 3s infinite alternate}@keyframes g{from{box-shadow:0 0 6px var(--rgb)}to{box-shadow:0 0 22px var(--rgb)}}textarea{width:100%;height:90px;background:#000;color:#0f0;border:0;border-radius:8px}input[type=color]{width:100%;height:40px;border:0}</style>
</head><body>
<header><span id="t">AxDubai Dark Gov V2 • ۲۰۲۶</span><span><button onclick="m('dark')">دارک</button><button onclick="m('light')">نور</button><button onclick="m('official')">رسمی</button><button onclick="l()">FA/EN</button></span></header>
<div class="grid">
<div class="card rgb"><h4>سخت‌افزار زنده</h4><div>CPU: AArch64 8core + AMD64 ready<br>RAM: stream + mmap<br>ROM: overlay<br>NPU: NNAPI<br>حافظه: eMMC/UFS monitor</div><button onclick="b()">تقویت حرفه‌ای</button></div>
<div class="card"><h4>۴ میلیارد رنگ + RGB</h4><input type="color" value="#00e5ff" oninput="document.documentElement.style.setProperty('--rgb',this.value)"><div>۳۲ بیت = ۴٬۲۹۴٬۹۶۷٬۲۹۶ رنگ</div></div>
<div class="card"><h4>اجرای خط‌به‌خط</h4><textarea id="c">axdark2 --scan /sdcard/data.txt --threads 8
settings get global window_animation_scale</textarea><br><button onclick="r()">اجرا</button><div id="o"></div></div>
<div class="card"><h4>نصب</h4><div>مسیر در ریپو: plugins/axdarkgov2 - service + webui + system.prop</div></div>
</div>
<script>function m(x){document.body.className=x==='light'?'light':''}function l(){const t=document.getElementById('t');t.innerText=t.innerText.includes('AxDubai')?'AxDubai Dark Gov V2 • 2026':'AxDubai Dark Gov V2 • ۲۰۲۶'}async function r(){document.getElementById('o').innerText='[preview] '+document.getElementById('c').value}async function b(){document.getElementById('o').innerText='boost pinned to cores 4-7'}</script>
</body></html>
