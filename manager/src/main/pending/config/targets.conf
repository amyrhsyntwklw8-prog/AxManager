# VOID GMS Optimizer v4.0 - target manifest
# Format: PACKAGE|CATEGORY|MIN_PROFILE|DEFAULT_OP|NOTES
#
# v4.0: single OPTIMAL profile, no per-target gating. Every non-SAFE
# row is applied. The MIN_PROFILE column is preserved for documentation
# but is no longer consulted by the module.
#
# CATEGORY:
#   DRAIN  = pure battery drain
#   TEL    = telemetry / ads / analytics
#   LOC    = location services
#   SYNC   = sync adapters
#   SETUP  = setup / config services
#   OPT    = optional Google apps (skipped if used in last VOID_FG_GRACE_MIN)
#   SAFE   = never touch (whitelist-like)
#
# MIN_PROFILE: historical — see comment above. Values 1/2/3 ignored.
#
# DEFAULT_OP:
#   THROTTLE  = RUN_IN_BACKGROUND ignore + WAKE_LOCK deny/ignore
#   RESTRICT  = THROTTLE + standby bucket = rare
#   TRIM      = send-trim-memory hints + light throttle
#   DISABLE   = pm disable-user --user 0 <pkg>
#   KEEP      = do nothing

