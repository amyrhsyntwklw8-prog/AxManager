# VOID GMS Optimizer v4.0 - user configuration
# Edit on-device: <MODDIR>/config/voidgms.conf
# Changes take effect on next boot / next action.
#
# v4.0: single profile (OPTIMAL). No more lite/balanced/aggressive
# switching — the module picks the right balance internally and
# exposes only safety toggles below.

# === ALLOW NOTIFICATIONS TO ARRIVE FAST ===
# true  = com.google.android.gms keeps RUN_ANY_IN_BACKGROUND = allow (FCM works)
# false = full throttle applied to GMS (FCM may delay 1-2 minutes)
PROTECT_FCM=true

# === STANDALONE / ROOTED MODE ===
ENABLE_KERNEL_TWEAKS=false

# === AUTO OPTIMIZE ON BOOT ===
AUTO_OPTIMIZE_ON_BOOT=true

# === DEBUG LOGGING ===
DEBUG_LOG=true

# === RE-APPLY INTERVAL (seconds) ===
VOID_REAPPLY_INTERVAL=21600

# === AGGRESSIVE KILL ===
# If true, the global tweak stage calls `am kill-all` which terminates
# background AND cached processes (foreground stays). On by default
# in v4.0 — this is the main reason a single OPTIMAL profile works:
# we let the kernel reclaim everything Google left in memory.
AGGRESSIVE_KILL=true

# === FOREGROUND GRACE (minutes) ===
# Apps in OPT category (Maps, Photos, YT Music, etc) are skipped if
# they were used in the last N minutes. Detected via
# `dumpsys activity recents` + `dumpsys usagestats`. Set to 0 to disable.
VOID_FG_GRACE_MIN=10

# === HISTORY ROTATION ===
# Keeps the last N lines of optimize_history.csv to avoid /sdcard bloat.
VOID_HISTORY_KEEP=500

# === ENABLE METRICS ===
# When true (default), the module samples wakeups, network bytes, and
# CPU jiffies before/after each run and reports the delta. Costs
# negligible overhead (4-6 /proc reads). Set to false if you prefer
# the old behavior with no metric collection.
VOID_ENABLE_METRICS=true

# === TRIM LEVEL (LOW | MODERATE | COMPLETE) ===
# Override the default trim hint level. COMPLETE actually reclaims
# caches from apps; LOW is the gentlest. Most users want COMPLETE.
VOID_TRIM_LEVEL=COMPLETE

# === WHITELIST (apps NEVER throttled) ===
WHITELIST_PACKAGES="\
com.android.systemui \
com.android.launcher \
com.android.launcher3 \
com.android.launcher4 \
com.google.android.apps.nexuslauncher \
com.android.inputmethod.latin \
com.android.phone \
com.android.nfc \
com.android.settings \
com.google.android.inputmethod.latin \
com.samsung.android.honeyboard"
