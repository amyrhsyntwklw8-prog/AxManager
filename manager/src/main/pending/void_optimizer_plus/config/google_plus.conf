# VOID OPTIMIZER PLUS — Google modules config
# Edit on-device: <MODDIR>/void_optimizer_plus/config/google_plus.conf
# This file is auto-loaded by every G*.sh module.
# Each flag: true = apply, false = skip.
#
# Master switch — set to false to disable the whole Google+ engine.
ENABLE_GOOGLE_PLUS=true

# ----------------------------------------------------------------
# G1..G10 — original 10 Google modules
# ----------------------------------------------------------------

# G1 — disable internal GMS components (chimera, gcm, ads, fitness, …)
G1_GMS_DEEP_DISABLE=true

# G2 — throttle Google Services Framework + login + gservices
G2_GSF_THROTTLE=true

# G3 — throttle Play Store (Vending)
G3_PLAY_STORE_THROTTLE=true

# G4 — kill ads / privacy-sandbox / measurement components
G4_ADS_COMPONENTS_KILL=true

# G5 — disable-user for Google telemetry/sync/setup packages
G5_GOOGLE_TELEMETRY_PKG_DISABLE=true

# G6 — throttle carrier config (Google + AOSP)
G6_CARRIER_CONFIG_THROTTLE=true

# G7 — force location off + block location appops for Google
G7_GOOGLE_LOCATION_FORCE_OFF=true

# G8 — FCM protect: re-apply allow on RUN_ANY_IN_BACKGROUND for GMS
#     Keep this TRUE unless you want push notifications to break.
G8_GOOGLE_FCM_PROTECT=true

# G9 — force rare standby bucket on every com.google.* package
G9_GMS_RARE_BUCKET_FOREVER=true

# G10 — kill GMS CheckinService (the worst offender)
G10_CHECKIN_SERVICE_KILL=true

# ----------------------------------------------------------------
# G11..G30 — 20 new Google-focused functions
# All default to true. Set any to false to skip a specific module.
# All G* modules check VOPL_FCM_SAFE_GMS_COMPONENTS in plus_core.sh
# and never disable FCM-critical components.
# ----------------------------------------------------------------

# G11 — block 9 dangerous sensor appops on every com.google.* pkg
G11_GOOGLE_APPOPS_SENSOR_BLOCK=true

# G12 — kill Velvet / Google Search persistent services
G12_VELVET_COMPONENTS_KILL=true

# G13 — disable Google battery/usage history uploads
G13_GOOGLE_BATTERY_HISTORY_OFF=true

# G14 — kill Google TTS + SpeechServices components
G14_GOOGLE_TTS_COMPONENTS_KILL=true

# G15 — remove ALL com.google.* from deviceidle whitelist
G15_GMS_IDLE_WHITELIST_REMOVE=true

# G16 — restrict background data for all com.google.* + global data saver
G16_GOOGLE_BG_DATA_RESTRICT=true

# G17 — clear pending jobs via cmd jobscheduler for all com.google.*
G17_GOOGLE_JOBSCHEDULER_QUOTA=true

# G18 — disable adaptive battery exception logic
G18_GOOGLE_BATTERY_SAVER_FORCE=true

# G19 — kill Wellbeing + Safety services
G19_GOOGLE_WELLBEING_COMPONENTS_KILL=true

# G20 — kill Partner Setup + Sync Adapters
G20_GOOGLE_PARTNER_COMPONENTS_KILL=true

# G21 — kill Google Assistant hotword / OPA / Pixel ambient
G21_GOOGLE_ASSISTANT_COMPONENTS_KILL=true

# G22 — kill Drive / Photos / Docs / Sheets sync services
G22_GOOGLE_DRIVE_COMPONENTS_KILL=true

# G23 — strip WAKE_LOCK + RUN_IN_BACKGROUND from all com.google.*
G23_GOOGLE_WAKELOCK_KILL=true

# G24 — disable-user for non-essential Google packages
G24_GOOGLE_PACKAGES_DISABLE=true

# G25 — block Google Setup Wizard boot-time account sync
G25_GOOGLE_SETUPWIZARD_SKIP=true

# G26 — revoke 10 dangerous runtime perms from GMS
G26_GOOGLE_GMS_UNWANTED_PERMS_REVOKE=true

# G27 — throttle Google cell/phone-location packages
G27_GOOGLE_THROTTLE_PHONELOCATION=true

# G28 — kill GMS account/phenotype/herrevad/lockbox components
G28_GOOGLE_ACCOUNTS_COMPONENTS_KILL=true

# G29 — block GMS restricted-network appops + read_logs
G29_GOOGLE_PLAY_SERVICES_TELEMETRY_KILL=true

# G30 — kill Pixel/AOC ambient display + always-on services
G30_GOOGLE_AOD_COMPONENTS_KILL=true

# ----------------------------------------------------------------
# Daily re-apply schedule (v4.0)
# Set to a number of hours (1..24) to re-apply all 30 modules
# periodically. 0 disables scheduling. The schedule is registered
# via cmd jobscheduler (no root) and is automatically refreshed
# on every boot. Override at call time:
#   VOPL_SCHEDULE_HOURS=12 sh action.sh schedule
# ----------------------------------------------------------------
VOPL_SCHEDULE_HOURS=24

# ----------------------------------------------------------------
# G31..G50 — v5.0 (20 new deep-system Google/Android functions)
# All FCM-safe. Set any to false to skip that specific module.
# ----------------------------------------------------------------
G31_GOOGLE_BACKUP_OFF=true
G32_GOOGLE_SYNC_ADAPTERS_KILL=true
G33_GOOGLE_PHOTOS_BG_KILL=true
G34_GOOGLE_MAPS_BG_KILL=true
G35_YOUTUBE_BG_KILL=true
G36_GBOARD_LEARNING_KILL=true
G37_PLAY_PROTECT_OFF=true
G38_WELLBEING_AGGREGATION_OFF=true
G39_FEEDBACK_UPLOAD_OFF=true
G40_FAMILYLINK_KILL=true
G41_FIREBASE_APPOPS_BLOCK=true
G42_DOZE_DEEP_CONSTANTS=true
G43_JOBSCHED_CONSTANTS=true
G44_GOOGLE_FGS_BLOCK=true
G45_GOOGLE_STATS_UPLOAD_KILL=true
G46_PLAY_AUTOUPDATE_OFF=true
G47_CHROME_WEBVIEW_BG_KILL=true
G48_GOOGLE_FORCE_STOP_NONCRIT=true
G49_AM_CONSTANTS_AGGRESSIVE=true
G50_BATTERY_SAVER_CONSTANTS_AGGRESSIVE=true

# --- v6.0 additions -----------------------------------------------
G51_NEARBY_SHARE_BG_KILL=true
G52_GOOGLE_HEALTH_SERVICES_DISABLE=true
G53_GOOGLE_LENS_BG_KILL=true
G54_NOW_PLAYING_KILL=true
G55_PERSONAL_SAFETY_KILL=true
G56_GOOGLE_ONE_BACKUP_KILL=true
G57_GOOGLE_RECORDER_KILL=true
G58_GOOGLE_FILES_BG_KILL=true
G59_GMAIL_BG_THROTTLE=true
G60_DEVICECONFIG_GOOGLE_FLAGS_OFF=true
