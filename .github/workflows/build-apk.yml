name: Build Debug APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Diagnose repo
        run: |
          echo "=== .gitmodules ==="
          cat .gitmodules || echo "NO .gitmodules"
          echo "=== AxManagerProvider.kt head ==="
          head -n 20 manager/src/main/java/frb/axeron/manager/AxManagerProvider.kt || true
          echo "=== modules ==="
          ls -la
          ls -la manager/src/main/java/frb/axeron/manager/ || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :manager:assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn
