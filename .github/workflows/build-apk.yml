name: Build Debug APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.daemon=false
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android packages
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1" || true
          yes | sdkmanager --licenses > /dev/null || true

      - name: Prepare signing for CI
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "signing.storeFile=${GITHUB_WORKSPACE}/debug.keystore" >> local.properties
          echo "signing.storePassword=android" >> local.properties
          echo "signing.keyAlias=androiddebugkey" >> local.properties
          echo "signing.keyPassword=android" >> local.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :manager:assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: manager/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
