name: Build Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build
        run: |
          export SDKM=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses || true
          $SDKM "platform-tools"
          $SDKM "platforms;android-34"
          $SDKM "build-tools;34.0.0"
          chmod +x gradlew
          ./gradlew :manager:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AxManager-debug
          path: manager/build/outputs/apk/debug/*.apk
