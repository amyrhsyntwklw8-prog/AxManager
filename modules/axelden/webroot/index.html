<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMNI60 REAL</title>
<style>body{background:#060609;color:#F5D97A;font-family:sans-serif;margin:0}header{padding:12px;font-weight:900;background:linear-gradient(90deg,#000,#0B1628,#3a2d00)}.card{background:#12141C;border:1px solid #6b5a1f;border-radius:12px;padding:12px;margin:10px}button{background:#F5D97A;border:0;border-radius:8px;padding:8px 11px;font-weight:800;margin:3px}.log{background:#000;color:#0f0;border-radius:8px;padding:8px;white-space:pre-wrap;max-height:240px;overflow:auto}input{width:100%;background:#000;color:#0f0;border:1px solid #333;border-radius:8px;padding:8px}canvas{width:100%;background:#000;border-radius:12px;display:block}</style>
</head><body>
<header>OMNI60 • ورودی OLD و ULTRA • خروجی ۴گانه واقعی</header>
<div class="card"><canvas id="bg" height="90"></canvas><div id="st">بررسی پل...</div><button onclick="check()">تست اتصال واقعی</button></div>
<div class="card"><input id="path" value="/sdcard/data.txt"><br><button onclick="runAll('old')">OLD همه با هم</button><button onclick="runAll('ultra')">ULTRA همه با هم</button><button onclick="runParallel()">موازی ۴ خروجی</button><div id="o" class="log">هنوز اجرا نشده</div></div>
<div class="card"><button onclick="runApp('com.zhiliaoapp.musically','TikTok')">TikTok</button><button onclick="runApp('com.google.android.youtube','YouTube')">YouTube</button><button onclick="runApp('com.instagram.android','Instagram')">Instagram</button><div id="a" class="log"></div></div>
<div class="card"><button onclick="readLog()">service.log واقعی</button> <button onclick="runHw()">hwinfo واقعی</button><div id="l" class="log"></div></div>
<script>
let C=document.getElementById('bg'),X=C.getContext('2d');function rs(){C.width=C.clientWidth*2;C.height=C.clientHeight*2}rs();addEventListener('resize',rs);(function loop(t){let w=C.width,h=C.height;X.fillStyle='#000';X.fillRect(0,0,w,h);X.fillStyle='#00E5FF';for(let x=0;x<w;x+=14){let y=h/2+Math.sin(x/40+t/500)*h/3;X.fillRect(x,y,4,4)}requestAnimationFrame(loop)})(0);
function modDir(){try{if(window.ksu&&ksu.moduleInfo){var j=JSON.parse(ksu.moduleInfo());if(j.moduleDir)return j.moduleDir}}catch(e){}return "/data/adb/axeron/plugins/axelden"}
function ksuAsync(cmd,cwd){return new Promise(function(res,rej){var cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*999999);window[cb]=function(er,o,e){try{delete window[cb]}catch(x){} if(er){rej(new Error(e||("errno "+er)))}else{res(o)}};try{ksu.exec(cmd,JSON.stringify({cwd:cwd}),cb);setTimeout(function(){if(window[cb]){try{delete window[cb]}catch(x){} rej(new Error("timeout-no-callback"))}},25000)}catch(e){rej(e)}})}
async function bexec(cmd){var d=modDir();if(window.ksu&&ksu.exec){try{return await ksuAsync(cmd,d)}catch(e){return ksu.exec(cmd)}}if(window.Axeron&&Axeron.exec){return await window.Axeron.exec(cmd)}throw new Error("no-bridge")}
const BLOCK=["rm -rf","mkfs","dd if=","/dev/block","chmod 777 /","reboot -p"];
function blocked(s){for(var i=0;i<BLOCK.length;i++){if(s.indexOf(BLOCK[i])>=0) return BLOCK[i]}return null}
async function check(){var s=document.getElementById('st');var hk=(window.ksu&&ksu.exec)?"ksu:OK":"ksu:NO";var ha=(window.Axeron&&Axeron.exec)?"Axeron:OK":"Axeron:NO";s.innerText=hk+" | "+ha+" | "+modDir();if(hk==="ksu:NO"&&ha==="Axeron:NO"){s.innerText+=" >> از داخل AxManager وارد شو نه کروم";return}try{s.innerText+="\n"+await bexec("ls "+modDir()+"/system/bin; ls "+modDir())}catch(e){s.innerText+="\nخطا: "+e}}
async function runAll(m){var o=document.getElementById('o'),p=document.getElementById('path').value;var b=blocked(p);if(b){o.innerText="مسدود: "+b;return}if(!(window.ksu&&ksu.exec)&&!(window.Axeron&&Axeron.exec)){o.innerText="خطا: پل پیدا نشد. هیچ عدد جعلی نیست.";return}o.innerText="در حال اجرا "+m+" ...";try{var r=await bexec("chmod +x "+modDir()+"/system/bin/* 2>/dev/null; echo "+m+" > /data/local/tmp/axelden_mode; ax-all "+m+" \""+p+"\" 2>&1 || sh "+modDir()+"/system/bin/ax-all "+m+" \""+p+"\" 2>&1");o.innerText=r}catch(e){o.innerText="خطای واقعی: "+e}}
async function runParallel(){var o=document.getElementById('o');try{var r=await Promise.all([bexec("ax-cpu ultra 2>&1 || sh "+modDir()+"/system/bin/ax-cpu ultra 2>&1"),bexec("ax-ram 2>&1 || sh "+modDir()+"/system/bin/ax-ram 2>&1"),bexec("ax-gpu 2>&1 || sh "+modDir()+"/system/bin/ax-gpu 2>&1"),bexec("axelden-scan \""+document.getElementById('path').value+"\" 8 2>&1 || echo NATIVE-FALLBACK")]);o.innerText="---CPU---\n"+r[0]+"\n---RAM---\n"+r[1]+"\n---GPU---\n"+r[2]+"\n---SCAN---\n"+r[3]}catch(e){o.innerText="خطای واقعی: "+e}}
async function runApp(pkg,l){var a=document.getElementById('a');try{a.innerText=l+"\n"+await bexec("ax-app "+pkg+" 2>&1 || sh "+modDir()+"/system/bin/ax-app "+pkg+" 2>&1")}catch(e){a.innerText="خطای واقعی: "+e}}
async function readLog(){var l=document.getElementById('l');try{l.innerText=await bexec("cat "+modDir()+"/service.log | tail -n 40")}catch(e){l.innerText="خطای واقعی: "+e}}
async function runHw(){var l=document.getElementById('l');try{l.innerText=await bexec("getprop ro.product.model; cat /proc/cpuinfo | head -n 10; cat /proc/meminfo | head -n 5; cat /sys/class/thermal/thermal_zone0/temp; cat /sys/class/power_supply/battery/capacity")}catch(e){l.innerText="خطای واقعی: "+e}}
check();
</script></body></html>
