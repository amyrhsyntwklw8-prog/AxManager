<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMNI60 REAL</title>
<style>body{background:#060609;color:#F5D97A;font-family:sans-serif;margin:0}.card{background:#12141C;border:1px solid #6b5a1f;border-radius:12px;padding:12px;margin:10px}button{background:#F5D97A;border:0;border-radius:8px;padding:8px 11px;font-weight:800;margin:3px}.log{background:#000;color:#0f0;border-radius:8px;padding:8px;white-space:pre-wrap;max-height:240px;overflow:auto}input{width:100%;background:#000;color:#0f0;border:1px solid #333;border-radius:8px;padding:8px}</style></head><body>
<div class="card"><div id="st">بررسی پل...</div><button onclick="check()">تست اتصال</button></div>
<div class="card"><input id="path" value="/sdcard/data.txt"><br><button onclick="runAll('old')">OLD واقعی</button><button onclick="runAll('ultra')">ULTRA واقعی</button><div id="o" class="log">هنوز اجرا نشده</div></div>
<div class="card"><button onclick="runApp('com.zhiliaoapp.musically','TikTok')">TikTok</button><button onclick="runApp('com.google.android.youtube','YouTube')">YouTube</button><div id="a" class="log"></div></div>
<script>
function modDir(){try{if(window.ksu&&ksu.moduleInfo){var j=JSON.parse(ksu.moduleInfo());if(j.moduleDir)return j.moduleDir}}catch(e){}return "/data/adb/axeron/plugins/axelden"}
function ksuAsync(c,w){return new Promise(function(r,j){var k="cb_"+Date.now()+"_"+Math.floor(Math.random()*999999);window[k]=function(e,o,x){try{delete window[k]}catch(y){}if(e)j(new Error(x||e));else r(o)};try{ksu.exec(c,JSON.stringify({cwd:w}),k);setTimeout(function(){if(window[k]){delete window[k];j(new Error("timeout"))}},25000)}catch(e){j(e)}})}
async function bexec(c){var d=modDir();if(window.ksu&&ksu.exec){try{return await ksuAsync(c,d)}catch(e){return ksu.exec(c)}}if(window.Axeron&&Axeron.exec)return await window.Axeron.exec(c);throw new Error("no-bridge")}
async function check(){var s=document.getElementById('st');var h=(window.ksu&&ksu.exec)?"ksu:OK":"ksu:NO";s.innerText=h+" | "+modDir();try{s.innerText+="\n"+await bexec("ls "+modDir()+"/system/bin")}catch(e){s.innerText+="\nخطا: "+e}}
async function runAll(m){var o=document.getElementById('o'),p=document.getElementById('path').value;if(p.indexOf("rm -rf")>=0||p.indexOf("/dev/block")>=0){o.innerText="مسدود";return}if(!(window.ksu&&ksu.exec)&&!(window.Axeron&&Axeron.exec)){o.innerText="خطا: پل پیدا نشد. هیچ عدد جعلی نیست.";return}o.innerText="در حال اجرا "+m+" ...";try{o.innerText=await bexec("chmod +x "+modDir()+"/system/bin/* 2>/dev/null;echo "+m+" > /data/local/tmp/axelden_mode;ax-all "+m+" \""+p+"\" 2>&1||sh "+modDir()+"/system/bin/ax-all "+m+" \""+p+"\" 2>&1")}catch(e){o.innerText="خطای واقعی: "+e}}
async function runApp(p,l){var a=document.getElementById('a');try{a.innerText=l+"\n"+await bexec("ax-app "+p+" 2>&1||sh "+modDir()+"/system/bin/ax-app "+p+" 2>&1")}catch(e){a.innerText="خطای واقعی: "+e}}
check();</script></body></html>
